name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # The standing lane: the module built from source beside the engine at the commit engine.pins
  # names, the way it is developed (D-studio-technical-021).
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: capsule-engine-tiled

      - name: Read engine pins
        id: pins
        shell: bash
        working-directory: capsule-engine-tiled
        run: |
          source engine.pins
          echo "capsule=$CAPSULE_ENGINE_COMMIT" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: just-awesome-games/capsule-engine
          ref: ${{ steps.pins.outputs.capsule }}
          path: capsule-engine

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: capsule-engine-tiled/global.json

      - name: Restore
        working-directory: capsule-engine-tiled
        run: dotnet restore -p:CapsuleSourcePath=../capsule-engine

      - name: Build
        working-directory: capsule-engine-tiled
        run: dotnet build --configuration Release --no-restore -p:CapsuleSourcePath=../capsule-engine

      - name: Format
        working-directory: capsule-engine-tiled
        run: dotnet format --verify-no-changes --no-restore

      - name: Test
        working-directory: capsule-engine-tiled
        run: dotnet test --configuration Release --no-build -p:CapsuleSourcePath=../capsule-engine

  # The release lane: the pinned Capsule package from NuGet, the committed lock files, and the pack
  # a consumer would install. Runs on demand ahead of a release (RELEASING.md), not on every push:
  # between releases the pinned package is expected to lag the engine's main.
  packages:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Restore
        run: dotnet restore --locked-mode -p:CapsuleUsePackages=true
      - name: Build (Debug)
        run: dotnet build --configuration Debug --no-restore -p:CapsuleUsePackages=true
      - name: Build (Release)
        run: dotnet build --configuration Release --no-restore -p:CapsuleUsePackages=true
      - name: Format
        run: dotnet format --verify-no-changes --no-restore
      - name: Test
        run: dotnet test --configuration Release --no-build -p:CapsuleUsePackages=true
      - name: Pack
        run: >
          dotnet pack Capsule.Tiled.slnx
          --configuration Release
          --no-build
          --output artifacts/packages
          -p:CapsuleUsePackages=true
      - name: Verify package layout
        shell: bash
        run: |
          nupkg=$(ls artifacts/packages/JAG.Capsule.Tiled.*.nupkg)
          unzip -l "$nupkg"
          for entry in buildTransitive/JAG.Capsule.Tiled.targets tools/net10.0/any/Capsule.Tiled.dll; do
            if ! unzip -l "$nupkg" | grep -q " $entry\$"; then
              echo "::error::$nupkg is missing $entry — a consumer's build would not run the importer."
              exit 1
            fi
          done

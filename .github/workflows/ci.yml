name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # The module built from source beside the engine's main head, with no pin. An engine change the
  # module needs is pushed first.
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: capsule-engine-tiled

      - uses: actions/checkout@v7
        with:
          repository: just-awesome-games/capsule-engine
          ref: main
          path: capsule-engine

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: capsule-engine-tiled/global.json

      # Source mode is the local file a developer keeps, so dotnet format sees it too.
      - name: Name the engine clone
        working-directory: capsule-engine-tiled
        run: |
          cat > Directory.Build.local.props <<'EOF'
          <Project>
            <PropertyGroup>
              <CapsuleSourcePath>../capsule-engine</CapsuleSourcePath>
            </PropertyGroup>
            <Import Project="$(CapsuleSourcePath)/build/Capsule.Build.props" Condition="'$(CapsuleSourcePath)' != ''" />
          </Project>
          EOF

      - name: Restore
        working-directory: capsule-engine-tiled
        run: dotnet restore

      - name: Build
        working-directory: capsule-engine-tiled
        run: dotnet build --configuration Release --no-restore

      # Format takes no MSBuild properties, and its workspace must match the Release build above.
      - name: Format
        working-directory: capsule-engine-tiled
        env:
          Configuration: Release
        run: dotnet format --verify-no-changes --no-restore

      - name: Test
        working-directory: capsule-engine-tiled
        run: dotnet test --configuration Release --no-build

  # The pinned Capsule package, the committed lock files and the pack a consumer installs. It runs
  # on demand ahead of a release because the pin lags the engine's main between releases.
  packages:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Restore
        run: dotnet restore --locked-mode
      - name: Build (Release)
        run: dotnet build --configuration Release --no-restore
      # Format takes no MSBuild properties, and its workspace must match the Release build above.
      - name: Format
        env:
          Configuration: Release
        run: dotnet format --verify-no-changes --no-restore
      - name: Test
        run: dotnet test --configuration Release --no-build
      - name: Pack
        run: >
          dotnet pack JAG.Capsule.Tiled.slnx
          --configuration Release
          --no-build
          --output artifacts/packages
      - name: Verify package layout
        shell: bash
        run: |
          nupkg=$(ls artifacts/packages/JAG.Capsule.Tiled.*.nupkg)
          unzip -l "$nupkg"
          for entry in buildTransitive/JAG.Capsule.Tiled.targets buildTransitive/capsule.tiled-project buildTransitive/capsule-property-types.json tools/net10.0/any/JAG.Capsule.Tiled.dll; do
            if ! unzip -l "$nupkg" | grep -q " $entry\$"; then
              echo "::error::$nupkg is missing $entry. A consumer's build would not run the importer."
              exit 1
            fi
          done
